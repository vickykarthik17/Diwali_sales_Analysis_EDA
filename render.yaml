services:
  - type: web
    name: diwali-sales-dashboard
    env: python
    pythonVersion: 3.9
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --client.toolbarMode=minimal --logger.level=error --client.showErrorDetails=false --server.enableCORS=true --server.enableXsrfProtection=true